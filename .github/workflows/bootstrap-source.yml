name: Import ZEUS Garage source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand the verified ZEUS Garage source bundle
        shell: bash
        run: |
          set -euo pipefail
          echo '887e63aaaf90564956dd0c2fc6833816f5922f921da84bd39f884d0935643a36  .bootstrap/zeus-source.tar.xz' | sha256sum -c -
          tar -xJf .bootstrap/zeus-source.tar.xz -C .
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/zeusgarage/mobile/MainActivity.kt
          test -f app/src/main/res/drawable-nodpi/zeus_truck.webp
          test -f .github/workflows/android-apk.yml
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete ZEUS Garage Batches 1 and 2 Android source'
          git push origin HEAD:main
